pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // FAIL_ON_PROJECT_REPOS: keep every repository declared here so a module
    // cannot quietly pull from somewhere unaudited.
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "CoolCryptoDashboard"
include ":app"
