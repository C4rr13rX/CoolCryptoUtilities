# Chaquopy unpacks CPython plus numpy/pandas during the build; the 512 MB
# default heap runs out partway through and fails with a confusing OOM.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Chaquopy inspects the ABI list; keep it aligned with abiFilters in
# app/build.gradle or it downloads wheels for architectures we do not ship.
android.defaults.buildfeatures.buildconfig=true
